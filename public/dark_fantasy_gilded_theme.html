<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dark Fantasy Gilded Solitaire Theme</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --gold-primary: #d4af37;
    --gold-bright: #f9e27c;
    --gold-dark: #8c6d23;
    --gold-gradient: linear-gradient(135deg, #fce082 0%, #d4af37 50%, #997825 100%);
    --midnight-bg: #090b10;
    --card-radius: 10px;
    --card-width: 140px;
    --card-height: 210px;
  }

  body {
    background: #06090e;
    color: #e2e8f0;
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    margin: 0;
    padding: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1 {
    font-size: 22px;
    margin-bottom: 4px;
    color: #f7d774;
    text-shadow: 0 2px 10px rgba(212,175,55,0.4);
    letter-spacing: 0.5px;
  }
  p.sub {
    font-size: 13px;
    color: #94a3b8;
    margin-bottom: 28px;
  }

  .deck-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 16px;
    padding: 24px;
    background: radial-gradient(circle at 50% 50%, #151d28 0%, #090c12 100%);
    border-radius: 16px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(212,175,55,0.2);
  }

  /* Card Container */
  .card-gilded {
    width: var(--card-width);
    height: var(--card-height);
    border-radius: var(--card-radius);
    background: var(--gold-gradient);
    padding: 4px;
    box-sizing: border-box;
    position: relative;
    box-shadow: 0 8px 24px rgba(0,0,0,0.7), 0 2px 6px rgba(212,175,55,0.25);
    user-select: none;
    overflow: hidden;
    isolation: isolate;
  }

  /* Inner Card Face */
  .card-inner {
    width: 100%;
    height: 100%;
    background: var(--midnight-bg);
    border-radius: calc(var(--card-radius) - 3px);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Gold Celtic / Filigree Border Overlay */
  .filigree-frame {
    position: absolute;
    inset: 3px;
    pointer-events: none;
    z-index: 4;
  }

  /* Character / Art Layer */
  .art-layer {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .art-layer img,
  .art-layer svg {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Subtle vignette over the illustration */
  .art-vignette {
    position: absolute;
    inset: 0;
    z-index: 2;
    background: radial-gradient(circle at 50% 40%, rgba(9,11,16,0) 30%, rgba(9,11,16,0.6) 80%, rgba(9,11,16,0.95) 100%),
                linear-gradient(to bottom, rgba(9,11,16,0.4) 0%, transparent 25%, transparent 75%, rgba(9,11,16,0.7) 100%);
    pointer-events: none;
  }

  /* Indices: Top Left & Bottom Right */
  .index-badge {
    position: absolute;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 0.9;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.9));
  }
  .index-top {
    top: 6px;
    left: 8px;
  }

  .rank-glyph {
    font-family: 'Cinzel', 'Times New Roman', Georgia, serif;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: -0.5px;
    background: var(--gold-gradient);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .suit-glyph {
    width: 18px;
    height: 18px;
    margin-top: 3px;
  }

  .suit-heart-fill,
  .suit-diamond-fill {
    fill: #b91c1c;
    stroke: #f6d365;
    stroke-width: 4;
  }
  .suit-gold-fill {
    fill: url(#goldLinear);
    stroke: #f9e27c;
    stroke-width: 3;
  }
</style>
</head>
<body>

<h1>Dark Fantasy Gilded Solitaire Theme</h1>
<p class="sub">Deep midnight velvet canvas, metallic gradient gold borders, and illuminated court portraits.</p>

<div class="deck-row">
  <!-- ACE OF SPADES (Glow Crest) -->

          <path d="M64 120 L58 145 L82 145 L76 120 Z" fill="url(#goldLinear)"/>

      <div class="art-vignette"></div>

      <svg class="filigree-frame" viewBox="0 0 132 202">
        <rect x="2" y="2" width="128" height="198" rx="6" fill="none" stroke="url(#goldLinear)" stroke-width="1.2" stroke-dasharray="6 2 2 2"/>

    </div>
  </div>

  <!-- KING OF HEARTS -->
  <div class="card-gilded">
    <div class="card-inner">
      <div class="index-badge index-top">

            <radialGradient id="redGlow" cx="50%" cy="30%" r="60%">

          <line x1="125" y1="50" x2="60" y2="185" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M48 60 L45 35 L58 48 L70 30 L82 48 L95 35 L92 60 Z" fill="url(#goldLinear)" stroke="#92400e" stroke-width="1"/>

        <rect x="2" y="2" width="128" height="198" rx="6" fill="none" stroke="url(#goldLinear)" stroke-width="1.2" stroke-dasharray="6 2 2 2"/>
        <path d="M6 18 L18 6 M6 6 L6 14 M6 6 L14 6" stroke="url(#goldLinear)" stroke-width="1.5" fill="none"/>
        <path d="M126 18 L114 6 M126 6 L126 14 M126 6 L118 6" stroke="url(#goldLinear)" stroke-width="1.5" fill="none"/>
        <path d="M6 184 L18 196 M6 196 L6 188 M6 196 L14 196" stroke="url(#goldLinear)" stroke-width="1.5" fill="none"/>
        <path d="M126 184 L114 196 M126 196 L126 188 M126 196 L118 196" stroke="url(#goldLinear)" stroke-width="1.5" fill="none"/>
      </svg>
    </div>
  </div>

  <!-- QUEEN OF SPADES -->
  <div class="card-gilded">
    <div class="card-inner">
      <div class="index-badge index-top">
        <span class="rank-glyph">Q</span>
        <svg class="suit-glyph" viewBox="0 0 100 100">
          <path class="suit-gold-fill" d="M50 15 C50 15 88 50 88 68 C88 80 78 86 66 86 C54 86 51 78 50 74 C49 78 46 86 34 86 C22 86 12 80 12 68 C12 50 50 15 50 15 Z" />

        <path d="M6 18 L18 6 M6 6 L6 14 M6 6 L14 6" stroke="url(#goldLinear)" stroke-width="1.5" fill="none"/>
        <path d="M126 18 L114 6 M126 6 L126 14 M126 6 L118 6" stroke="url(#goldLinear)" stroke-width="1.5" fill="none"/>
        <path d="M6 184 L18 196 M6 196 L6 188 M6 196 L14 196" stroke="url(#goldLinear)" stroke-width="1.5" fill="none"/>
        <path d="M126 184 L114 196 M126 196 L126 188 M126 196 L118 196" stroke="url(#goldLinear)" stroke-width="1.5" fill="none"/>
      </svg>
    </div>
  </div>

  <!-- JACK OF DIAMONDS -->
  <div class="card-gilded">
    <div class="card-inner">
      <div class="index-badge index-top">
        <span class="rank-glyph">J</span>
        <svg class="suit-glyph" viewBox="0 0 100 100">
          <polygon class="suit-diamond-fill" points="50,10 88,50 50,90 12,50" />
        </svg>
      </div>

      <div class="art-layer">
        <svg viewBox="0 0 140 210" style="width:100%; height:100%;">
          <line x1="110" y1="130" x2="118" y2="190" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
          <line x1="102" y1="145" x2="118" y2="145" stroke="url(#goldLinear)" stroke-width="2"/>
          <path d="M22 210 C26 145 40 125 70 125 C100 125 114 145 118 210 Z" fill="#5c1d1d"/>
          <path d="M35 210 L45 138 L95 138 L105 210 Z" fill="#78350f" stroke="#451a03" stroke-width="1.5"/>
