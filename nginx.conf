server {
    listen 80;
    server_name solitare.beechem.site localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/manifest+json image/svg+xml;

    # Correct PWA Webmanifest MIME type
    types {
        application/manifest+json webmanifest;
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Caching for immutable built assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Service Worker and Manifest: No-cache to allow immediate updates
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location = /manifest.webmanifest {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # SPA routing fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
