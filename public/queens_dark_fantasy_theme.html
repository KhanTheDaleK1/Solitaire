<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collector Card Packs - Solitaire Gallery</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --gold-rim: linear-gradient(135deg, #fce082 0%, #d4af37 40%, #aa8428 75%, #573e0c 100%);
    --midnight-base: #07090e;
    --card-width: 165px;
    --card-height: 245px;
    --card-radius: 11px;
  }

  body {
    background: radial-gradient(circle at 50% 20%, #151b26 0%, #06080d 100%);
    color: #e2e8f0;
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    margin: 0;
    padding: 30px 15px 50px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  h1 {
    font-size: 25px;
    margin-bottom: 4px;
    color: #f7d774;
    text-shadow: 0 2px 14px rgba(212,175,55,0.5);
    letter-spacing: 0.5px;
    text-align: center;
  }
  p.sub {
    font-size: 13.5px;
    color: #94a3b8;
    margin-bottom: 18px;
    text-align: center;
    max-width: 680px;
  }

  .pack-tabs {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  .pack-tab {
    padding: 9px 16px;
    border-radius: 999px;
    background: rgba(15, 23, 42, 0.8);
    border: 1.5px solid rgba(212, 175, 55, 0.3);
    color: #e2e8f0;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.18s ease;
  }
  .pack-tab.active {
    background: linear-gradient(135deg, #d4af37 0%, #997825 100%);
    color: #090b10;
    border-color: #fff3b0;
    box-shadow: 0 0 16px rgba(212, 175, 55, 0.45);
  }

  h2.tier-title {
    font-family: 'Cinzel', serif;
    font-size: 16px;
    color: #f8e287;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin: 22px 0 10px;
  }

  .deck-row {
    display: flex;
    gap: 16px;
    padding: 22px 22px;
    background: rgba(0, 0, 0, 0.55);
    border: 1px solid rgba(212,175,55,0.28);
    border-radius: 18px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.85);
    overflow-x: auto;
    max-width: 96vw;
    box-sizing: border-box;
  }

  .card-gilded {
    width: var(--card-width);
    height: var(--card-height);
    border-radius: var(--card-radius);
    background: var(--gold-rim);
    padding: 3.5px;
    box-sizing: border-box;
    position: relative;
    box-shadow: 0 10px 25px rgba(0,0,0,0.85), 0 2px 8px rgba(212,175,55,0.22);
    user-select: none;
    flex-shrink: 0;
    overflow: hidden;
    isolation: isolate;
    transition: transform 0.22s ease, box-shadow 0.22s ease;
  }
  .card-gilded:hover {
    transform: translateY(-6px) scale(1.03);
    box-shadow: 0 18px 36px rgba(0,0,0,0.92), 0 0 18px rgba(212,175,55,0.45);
  }

  .card-inner {
    width: 100%;
    height: 100%;
    background: var(--midnight-base);
    border-radius: calc(var(--card-radius) - 3px);
    position: relative;
    overflow: hidden;
  }

  .art-layer {
    position: absolute;
    inset: 0;
    z-index: 1;
  }
  .art-layer img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 8%;
    display: block;
    filter: contrast(1.04) saturate(1.08);
  }

  .art-vignette {
    position: absolute;
    inset: 0;
    z-index: 2;
    background:
      radial-gradient(circle at 14% 10%, rgba(7,9,14,0.75) 0%, rgba(7,9,14,0) 34%),
      radial-gradient(circle at 88% 8%, rgba(7,9,14,0.6) 0%, rgba(7,9,14,0) 26%),
      linear-gradient(to bottom, rgba(7,9,14,0.32) 0%, transparent 22%, transparent 80%, rgba(7,9,14,0.68) 100%);
    pointer-events: none;
  }

  .filigree-frame {
    position: absolute;
    inset: 3px;
    width: calc(100% - 6px);
    height: calc(100% - 6px);
    pointer-events: none;
    z-index: 4;
  }

  .index-badge {
    position: absolute;
    top: 7px;
    left: 8px;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 0.9;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.95));
  }

  .rank-glyph {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 21px;
    font-weight: 900;
    background: linear-gradient(180deg, #fff6c5 0%, #e5be53 55%, #9e731b 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .suit-glyph {
    width: 14px;
    height: 14px;
    margin-top: 2px;
  }

  .top-pip {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 14px;
    height: 14px;
    z-index: 5;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.9));
  }
</style>
</head>
<body>

  <h1>Collector Card Deck Gallery</h1>
  <p class="sub">Preview all 5 collector packs: High Fantasy Oil Paintings, Ancient Greek Lovers, Vintage Pin-Up, Hentai Waifu, and Kamasutra.</p>

  <div class="pack-tabs">
    <button class="pack-tab active" data-pack="fantasy">⚔️ High Fantasy</button>
    <button class="pack-tab" data-pack="greek">🏛️ Greek Lovers</button>
    <button class="pack-tab" data-pack="pinup">💋 Vintage Pin-Up</button>
    <button class="pack-tab" data-pack="hentai">🌸 Hentai Waifu</button>
    <button class="pack-tab" data-pack="kamasutra">🪷 Kamasutra</button>
  </div>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fff3b0"/>
        <stop offset="40%" stop-color="#d4af37"/>
        <stop offset="80%" stop-color="#8f6818"/>
        <stop offset="100%" stop-color="#f3d266"/>
      </linearGradient>
      <path id="suit-heart" d="M50 88 C20 65 5 45 5 28 A22 22 0 0 1 50 18 A22 22 0 0 1 95 28 C95 45 80 65 50 88 Z" fill="#dc2626" stroke="url(#goldGrad)" stroke-width="6"/>
      <polygon id="suit-diamond" points="50,8 88,50 50,92 12,50" fill="#dc2626" stroke="url(#goldGrad)" stroke-width="6"/>
      <g id="suit-spade">
        <path d="M50 12 C50 12 88 48 88 68 C88 80 78 86 66 86 C54 86 51 78 50 74 C49 78 46 86 34 86 C22 86 12 80 12 68 C12 48 50 12 50 12 Z" fill="url(#goldGrad)"/>
        <path d="M44 76 L37 94 L63 94 L56 76 Z" fill="url(#goldGrad)"/>
      </g>
      <g id="suit-club">
        <circle cx="50" cy="31" r="19" fill="url(#goldGrad)"/>
        <circle cx="30" cy="60" r="19" fill="url(#goldGrad)"/>
        <circle cx="70" cy="60" r="19" fill="url(#goldGrad)"/>
        <path d="M44 64 L36 94 L64 94 L56 64 Z" fill="url(#goldGrad)"/>
      </g>
      <g id="filigree">
        <rect x="2" y="2" width="129" height="204" rx="6" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="5 2 1.5 2" opacity="0.85"/>
        <path d="M6 18 L18 6 M6 6 L6 14 M6 6 L14 6" stroke="url(#goldGrad)" stroke-width="1.6" fill="none"/>
        <path d="M127 18 L115 6 M127 6 L127 14 M127 6 L119 6" stroke="url(#goldGrad)" stroke-width="1.6" fill="none"/>
        <path d="M6 190 L18 202 M6 202 L6 194 M6 202 L14 202" stroke="url(#goldGrad)" stroke-width="1.6" fill="none"/>
        <path d="M127 190 L115 202 M127 202 L127 194 M127 202 L119 202" stroke="url(#goldGrad)" stroke-width="1.6" fill="none"/>
      </g>
    </defs>
  </svg>

  <h2 class="tier-title">The Four Queens</h2>
  <div class="deck-row" id="queens-row"></div>

  <h2 class="tier-title">The Four Kings</h2>
  <div class="deck-row" id="kings-row"></div>

  <h2 class="tier-title">The Four Jacks</h2>
  <div class="deck-row" id="jacks-row"></div>

  <script>
    const suits = [
      { key: 'hearts', ref: '#suit-heart' },
      { key: 'spades', ref: '#suit-spade' },
      { key: 'diamonds', ref: '#suit-diamond' },
      { key: 'clubs', ref: '#suit-club' }
    ];
    let activePack = 'fantasy';

    function getImgSrc(pack, role, suit) {
      return pack === 'fantasy' ? `/cards/${role}-${suit}.jpg` : `/cards/${pack}/${role}-${suit}.jpg`;
    }

    function renderTier(containerId, rankGlyph, rolePrefix) {
      const container = document.getElementById(containerId);
      container.innerHTML = suits.map(s => `
        <div class="card-gilded">
          <div class="card-inner">
            <div class="index-badge index-top">
              <span class="rank-glyph">${rankGlyph}</span>
              <svg class="suit-glyph" viewBox="0 0 100 100"><use href="${s.ref}"/></svg>
            </div>
            <svg class="top-pip" viewBox="0 0 100 100"><use href="${s.ref}"/></svg>
            <div class="art-layer">
              <img src="${getImgSrc(activePack, rolePrefix, s.key)}" alt="${rankGlyph} of ${s.key}" />
            </div>
            <div class="art-vignette"></div>
            <svg class="filigree-frame" viewBox="0 0 133 208"><use href="#filigree"/></svg>
          </div>
        </div>
      `).join('');
    }

    function renderAll() {
      renderTier('queens-row', 'Q', 'queen');
      renderTier('kings-row', 'K', 'king');
      renderTier('jacks-row', 'J', 'jack');
    }

    document.querySelectorAll('.pack-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.pack-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activePack = btn.dataset.pack;
        renderAll();
      });
    });

    renderAll();
  </script>
</body>
</html>
